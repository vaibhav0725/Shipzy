<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<!--shipzy-404-->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #082f49; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 64px; margin: 0; letter-spacing: -0.03em; }
  p { margin: 8px 0 0; color: #0369a1; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f0f9ff; } p { color: #7dd3fc; } }
</style>
</head>
<body>
<main><h1>404</h1><p>This page could not be found.</p></main>
<script>
// CloudFront serves this page, with a 404 status, for any path that has no file. If the site has a 404.html of its
// own, show that instead: asking for /404.html goes through the router like any request. If the site has none, that
// request lands back here (the marker above tells us), and this page stays.
fetch('/404.html', { cache: 'no-store' })
  .then(function (r) { return r.text(); })
  .then(function (t) { if (t.indexOf('shipzy-404') === -1) { document.open(); document.write(t); document.close(); } })
  .catch(function () {});
</script>
</body>
</html>
